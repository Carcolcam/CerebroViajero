name: CerebroViajero Sentinel (Vigilancia 24/7)

on:
  workflow_dispatch: # Permite ejecución manual

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para el auto-commit
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sincronizar Alertas y Soluciones (Gmail)
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          HOTMAIL_EMAIL: ${{ secrets.HOTMAIL_EMAIL }}
          HOTMAIL_CLIENT_ID: ${{ secrets.HOTMAIL_CLIENT_ID }}
          HOTMAIL_CLIENT_SECRET: ${{ secrets.HOTMAIL_CLIENT_SECRET }}
          HOTMAIL_REFRESH_TOKEN: ${{ secrets.HOTMAIL_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scratch/smart_monitor.py

      - name: Ejecutar Lógica de Check-in y Logística
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python checkin_logic.py

      - name: Auto-Corrección Inteligente de Itinerario
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scratch/apply_cancellations.py

      - name: Auto-Commit de cambios en datos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: actualización de alertas y logística [GitHub Sentinel]"
          file_pattern: 'alertas_sentinel.json itinerario_maestro.json'
